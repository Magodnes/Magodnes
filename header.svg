<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1F3864"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#E6EDF3"/>
      <stop offset="0.42" stop-color="#E6EDF3"/>
      <stop offset="0.5" stop-color="#8CC4FF"/>
      <stop offset="0.58" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#E6EDF3"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-900 0;900 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#58A6FF" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="c1"><rect x="245" y="185" height="30" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;410;410;0;0" keyTimes="0;0.1;0.21;0.24;1"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="250" y="185" height="30" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;400;400;0;0" keyTimes="0;0.25;0.35;0.46;0.49;1"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="240" y="185" height="30" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;420;420;0;0" keyTimes="0;0.5;0.6;0.71;0.74;1"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="255" y="185" height="30" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;390;390;0;0" keyTimes="0;0.75;0.85;0.96;0.99;1"/>
    </rect></clipPath>
  </defs>
  <style>
    .name { font: 700 46px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; animation: rise 1.2s ease-out both; }
    .sub  { font: 400 19px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #A9BCD8; animation: rise 1.2s ease-out 0.4s both; }
    .type { font: 500 16px 'Courier New', Consolas, monospace; fill: #58A6FF; }
    .line { animation: grow 1.4s ease-out 0.8s both; transform-origin: 450px 168px; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#dots)"/>
  <circle cx="150" cy="130" r="230" fill="url(#glow)">
    <animate attributeName="cx" values="150;750;150" dur="14s" repeatCount="indefinite"/>
  </circle>
  <text class="name" x="450" y="100" text-anchor="middle" fill="url(#shine)">Rodrigo Pintos Alvariza</text>
  <text class="sub" x="450" y="142" text-anchor="middle">Full-Stack Developer  ·  Lecturer at Universidad ORT Uruguay</text>
  <rect class="line" x="390" y="166" width="120" height="2" rx="1" fill="#58A6FF"/>
  <text class="type" x="450" y="206" text-anchor="middle" clip-path="url(#c1)">&gt; Building full-stack web applications</text>
  <text class="type" x="450" y="206" text-anchor="middle" clip-path="url(#c2)">&gt; Node.js · Express · React · MongoDB</text>
  <text class="type" x="450" y="206" text-anchor="middle" clip-path="url(#c3)">&gt; Teaching Programming 2 at ORT Uruguay</text>
  <text class="type" x="450" y="206" text-anchor="middle" clip-path="url(#c4)">&gt; Open to Full-Stack Developer roles</text>
</svg>
